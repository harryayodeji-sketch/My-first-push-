<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt</title>
    <style>
        /* CSS Reset & Basic Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #228e2e78;
            color: #137333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Receipt Card Container */
        .receipt-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 40px 30px;
            border: 5px solid #0b3a82;
            border-radius: 12px;
            box-shadow: 0 4000px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        /* Success Icon / Header */
        .success-icon {
            width: 60px;
            height: 60px;
            background-color: #228e2e78;
            color: #137333;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
        }

        .receipt-card h1 {
            font-size: 30px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .receipt-card p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <!-- Success Badge -->
        <div class="success-icon">✓</div>
        <h1>Payment Successful!</h1>
        <p class="subtitle">Thank you for your purchase, Harry. Your order is confirmed.</p>
