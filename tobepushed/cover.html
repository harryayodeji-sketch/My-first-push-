<!DOCTYPE html>
<html lang="en">  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing</title>
    <link rel="stylesheet" href="style.css">


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box
}
body {
    color: white;
    font-family: 'arial', sans-serif;
    background: linear-gradient(135deg, #101010, #202020, #141414);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
}
.player-card {
    background-color:rgba(35, 35, 35, 0.9);
    width: 100%;
    max-width: 380px;
    padding: 25px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-sizing: border-box;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5)
}
.player-card h1 { 
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-align: center;
    color: #b3b3b3;
}
.album-cover {
width: 100%;
aspect-ratio: 1 / 1;
object-fit: cover;
border-radius: 16px;

box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}
.artist-name {
  font-size: 14px;
  color:#a7a7a7;
  margin-top: -12px;
}
.song-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0;
}
.progress-container {
  width: 100%;
  height: 5px;
  background-color: #454545;
  border-radius: 10px;
  overflow: hidden;
}
.progress-bar {
  width: 40%;
  height: 100%;
  background-color: #1ed760;
  border-radius: 10px;
}
.music-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 35px;
  width: 100%;
  max-width: 350px;
}
.music-controls button {
    appearance: none;
    -webkit-appearance: none;
    background-color: transparent;
    border: none;
    box-shadow: none;

    color: #b3b3b3;
    font-size: 24px;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
    background: none !important;
    background-color: transparent !important;
    transition: transform 0.2s ease, color 0.2s ease;
}

.music-controls button:focus-visible {
    outline: 2px solid #1ed760;
    outline-offset: 4px;
}
.music-controls button:hover { 
    color: white;
     transform: scale(1.15);
}
.music-controls .play-button {
     background-color: #1ed760; 
     color: #f8f6f6;
      width: 58px;
       height: 58px; 
       border-radius: 50%;
        font-size: 24px; 
        display: flex;
         justify-content: center;
          align-items: center;
          padding: 0;
          line-height: 1;
          text-align: center;
           transition: transform 0.2s ease;
} 
.music-controls .play-button:hover {
     transform: scale(1.08);
      color: #111; 
}

    </style>
</head>
<body>
    <div class="player-card">
        <h1>Now Playing</h1>
        <img src="https://images.unsplash.com/photo-1779841380112-409f39e1d572?q=80&w=1936&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="album-cover" alt="Album Cover" >
        <h2 class="song-title">Happier</h2>
        <p class="artist-name">Ed Sheeran</p>
        <div class="progress-container">
    <div class="progress-bar"></div>
</div>

<div class="music-controls">
    <button>⏮</button>
    <button class="play-button">▶</button>
    <button>⏭</button>
</div>

</div>
<script>
    const playButton = document.querySelector(".play-button");
     const progressBar = document.querySelector(".progress-bar");
     
     let progress = 0;
      let timer;
      playButton.addEventListener("click", function() { 
        if (playButton.textContent === "▶") { 
            playButton.textContent = "⏸"; 
            
            timer = setInterval(function() { 
                if (progress < 100) {
                 progress += 1;
                  progressBar.style.width = progress + "%"; } 
                  else { clearInterval(timer); 
                  playButton.textContent = "▶"; } 
                  }, 500); } else { playButton.textContent = "▶"; 
                  clearInterval(timer); }
                  
                }); 
</script>
</body>
</html>
