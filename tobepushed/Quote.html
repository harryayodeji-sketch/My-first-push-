<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Inspiration</title>
</head>
<style>/* Reset default spacing */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Page background */
body {
    background-color: #f5f3eb;
    font-family: Arial, sans-serif;
    color: #243b32;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Main page container */
.quote-container {
    width: 90%;
    max-width: 600px;
    text-align: center;
}

/* Small heading */
.label {
    font-size: 12px;
    letter-spacing: 4px;
    color: #718778;
    margin-bottom: 18px;
}

/* Main heading */
h1 {
    font-size: 42px;
    margin-bottom: 35px;
    font-weight: 600;
}

/* Quote card */
.quote-card {
    background-color: #ffffff;
    padding: 40px 30px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(36, 59, 50, 0.08);
}

/* Large quotation mark */
.quote-mark {
    font-size: 70px;
    color: #8aa895;
    line-height: 1;
}

/* Actual quote */
.quote {
    font-size: 25px;
    line-height: 1.5;
    margin: 10px 0 20px;
}

/* Author name */
.author {
    color: #718778;
    font-size: 15px;
    font-weight: bold;
}

/* Decorative line */
.divider {
    width: 50px;
    height: 3px;
    background-color: #8aa895;
    margin: 30px auto;
    border-radius: 10px;
}

/* Small encouraging message */
.message {
    color: #777777;
    font-size: 14px;
    margin-bottom: 25px;
}

/* Button design */
.quote-button {
    background-color: #294b3c;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

/* Hover effect */
.quote-button:hover {
    background-color: #416b57;
}

/* Footer */
footer {
    font-size: 10px;
    letter-spacing: 2px;
    color: #8b968d;
    margin-top: 30px;
}

/* Mobile screen adjustments */
@media (max-width: 480px) {
    h1 {
        font-size: 32px;
    }

    .quote-card {
        padding: 30px 20px;
    }

    .quote {
        font-size: 21px;
    }
}
</style>

<body>

    <main class="quote-container">

        <p class="label">A LITTLE INSPIRATION</p>

        <h1>Words to live by.</h1>

        <div class="quote-card">

            <span class="quote-mark">“</span>

            <p class="quote">
                The secret of getting ahead is getting started.
            </p>

            <p class="author">— Mark Twain</p>

            <div class="divider"></div>

            <p class="message">
                Take a deep breath. You've got this.
            </p>

            <button class="quote-button">Another quote ↗</button>

        </div>

        <footer>
            MADE FOR YOUR DAILY DOSE OF INSPIRATION
        </footer>

    </main>

</body>
</html>
