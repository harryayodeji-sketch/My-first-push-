<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
/* Page styling */
body {
    background-color: #6c634085;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* Profile card */
.profile-card {
    background-color: white;
    width: 300px;
    padding: 30px;
    border-radius: 15px;
    Border: 1px solid #81b85a;
    text-align: center;
    box-shadow: 0 5px 20px lightgray;
}

/* Name */
#my-name {
    color: #294b3c;
    font-size: 32px;
}

/* Introduction */
#about-me {
    color: #666666;
    line-height: 1.6;
}

/* Skills heading */
h2 {
    color: #294b3c;
}

/* Skills list */
#my-skills {
    text-align: left;
    line-height: 2;
    color: #555555;
}

/* Contact button */
#contact-button {
    background-color: #294b3c;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
}

/* Button hover */
#contact-button:hover {
    background-color: #416b57;
}

/* Footer */
#page-footer {
    margin-top: 25px;
    font-size: 12px;
    color: gray;
}
</style>
</head>

<body>

    <div class="profile-card">

        <h1 id="my-name">Harry Ayodeji</h1>

        <p id="about-me">
            I'm a beginner learning how to build websites
            and solve problems with technology.
        </p>

        <h2>My Skills</h2>

        <ul id="my-skills">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>UI/UX Design</li>
        </ul>

        <button id="contact-button">Contact Me</button>

        <footer id="page-footer">
            © 2026 My Profile
        </footer>

    </div>

</body>
</html>
